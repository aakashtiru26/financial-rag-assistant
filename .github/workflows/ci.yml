name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
        env:
          FIN_RAG_API_KEY: test-key-for-ci
          FIN_RAG_HUGGINGFACE_API_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIN_RAG_DATA_DIR: ./data
          FIN_RAG_UPLOAD_DIR: ./data/uploads
          FIN_RAG_INDEX_DIR: ./data/index
          FIN_RAG_METADATA_DIR: ./data/metadata
          FIN_RAG_CHUNK_SIZE: 1200
          FIN_RAG_CHUNK_OVERLAP: 180
          FIN_RAG_RETRIEVAL_K: 5
          FIN_RAG_MAX_UPLOAD_MB: 50
          FIN_RAG_LOG_LEVEL: INFO
